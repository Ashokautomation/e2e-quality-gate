name: Enterprise AI Quality Gate

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run Sanity Tests
        run: npx playwright test --project=chromium --grep @sanity

  regression:
    needs: sanity
    runs-on: ubuntu-latest
    if: github.event_name == 'push' 
    
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      # DOWNLOAD ALL 3 BROWSERS HERE!
      - run: npx playwright install --with-deps
      
      - name: 🧠 AI Test Generation (Google Gemini)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node ai-generate.js

      - name: Run Full Regression Matrix
        run: npx playwright test --grep @regression
        
      - name: Calculate ROI & Flakiness
        run: node calculate-metrics.js
        
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-report
          path: |
            playwright-report/
            test-results.json