name: Enterprise Quality Gate

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ---------------------------------------------
  # JOB 1: SANITY (Fast, blocks PRs)
  # ---------------------------------------------
  sanity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run Sanity Tests
        run: npx playwright test --grep @sanity

  # ---------------------------------------------
  # JOB 2: REGRESSION (Slower, only on main branch)
  # ---------------------------------------------
  regression:
    needs: sanity # <--- THIS IS THE MAGIC! Regression ONLY runs if Sanity is Green!
    runs-on: ubuntu-latest
    # Only run full regression when code is pushed to main (merged), not on PRs
    if: github.event_name == 'push' 
    
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      
      - name: Run Full Regression
        run: npx playwright test --grep @regression
        
      - name: Calculate ROI & Flakiness
        run: node calculate-metrics.js
        
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: regression-report
          path: |
            playwright-report/
            test-results.json