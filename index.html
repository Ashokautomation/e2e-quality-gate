<!DOCTYPE html>
<html lang="en">
<head>
    <title>Mini Banking App</title>
    <style>
        body { font-family: Arial; text-align: center; margin-top: 50px; }
        .hidden { display: none; }
        input, button { padding: 10px; margin: 5px; font-size: 16px; }
        button { cursor: pointer; background-color: #007bff; color: white; border: none; border-radius: 4px;}
        button:hover { background-color: #0056b3; }
        .error { color: red; margin-top: 10px; }
    </style>
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div id="login-view">
        <h2>Enterprise Banking Login</h2>
        <input type="text" id="username" placeholder="Enter Username"><br><br>
        <input type="password" id="password" placeholder="Enter Password"><br><br>
        <button id="login-btn">Sign In</button>
        <div id="error-msg" class="error hidden">Invalid Credentials</div>
    </div>

    <!-- DASHBOARD SCREEN -->
    <div id="dashboard-view" class="hidden">
        <h2>Welcome to your Dashboard</h2>
        <h3 id="welcome-msg">Hello, Admin</h3>
        <h1 id="account-balance">$50,000.00</h1>
        <p>Account Balance</p>
    </div>

    <script>
        document.getElementById('login-btn').addEventListener('click', function() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            if(user === 'admin' && pass === 'password13') {
                document.getElementById('login-view').classList.add('hidden');
                document.getElementById('dashboard-view').classList.remove('hidden');
                document.getElementById('welcome-msg').innerText = "Hello, " + user;
            } else {
                document.getElementById('error-msg').classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
